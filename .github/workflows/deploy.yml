name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'frontend/**'
      - 'pages/**'
      - 'db/**'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v5
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - name: Build Frontend
        run: cd frontend && pnpm install --no-frozen-lockfile && pnpm build
        env:
          VITE_DEFAULT_LOCALE: ${{ vars.DEFAULT_LOCALE || 'zh' }}

      - name: Generate wrangler.toml
        run: |
          # Convert comma-separated DOMAINS to TOML array
          DOMAINS_TOML=$(echo "${{ vars.EMAIL_DOMAINS || vars.EMAIL_DOMAIN }}" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed 's/.*/"&"/' | paste -sd',' | sed 's/^/[/;s/$/]/')
          DEFAULT_DOMAINS_TOML=$(echo "${{ vars.DEFAULT_EMAIL_DOMAINS || vars.EMAIL_DOMAINS || vars.EMAIL_DOMAIN }}" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed 's/.*/"&"/' | paste -sd',' | sed 's/^/[/;s/$/]/')

          cat > worker/wrangler.toml << EOF
          name = "${{ vars.WORKER_NAME }}"
          main = "src/worker.ts"
          compatibility_date = "2025-04-01"
          compatibility_flags = [ "nodejs_compat" ]
          keep_vars = true

          routes = [
            { pattern = "${{ vars.WORKER_DOMAIN }}", custom_domain = true },
          ]

          [assets]
          directory = "../frontend/dist/"
          binding = "ASSETS"
          run_worker_first = true

          [vars]
          PREFIX = "tmp"
          DEFAULT_DOMAINS = ${DEFAULT_DOMAINS_TOML}
          DOMAINS = ${DOMAINS_TOML}
          BLACK_LIST = ""
          ENABLE_USER_CREATE_EMAIL = true
          ENABLE_USER_DELETE_EMAIL = true
          ENABLE_AUTO_REPLY = false
          DEFAULT_LANG = "${{ vars.DEFAULT_LOCALE || 'zh' }}"

          [[d1_databases]]
          binding = "DB"
          database_name = "${{ vars.D1_DATABASE_NAME }}"
          database_id = "${{ secrets.D1_DATABASE_ID }}"
          EOF

      - name: Install Worker Dependencies
        run: cd worker && pnpm install --no-frozen-lockfile

      - name: Deploy Worker
        run: cd worker && npx wrangler deploy --minify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
